<!doctype html>
<html lang="es">
<head><meta charset="UTF-8" /><title>Extraer puntos de los dibujos (machine learning)</title></head>
<body>
<p>Herramienta del equipo: pasa los dibujos de public/senas-lsm por MediaPipe y entrega los 21 puntos de cada variación.</p>
<script type="module">
import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision'

const LETRAS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('')
const LADO = 480

// Números al azar repetibles (para que los datos salgan siempre iguales).
function generador(semilla) {
  let s = semilla >>> 0
  return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296)
}

async function cargarImagen(letra) {
  const img = new Image()
  img.src = `/senas-lsm/${letra}.svg`
  await img.decode()
  return img
}

/** Dibuja una variación del dibujo: girado, escalado, movido, a veces en espejo y con trazo más grueso. */
function variacion(img, azar, k) {
  const c = document.createElement('canvas')
  c.width = c.height = LADO
  const ctx = c.getContext('2d')
  ctx.fillStyle = '#fff'
  ctx.fillRect(0, 0, LADO, LADO)
  const giro = k === 0 ? 0 : (azar() - 0.5) * 30 // ±15°
  const escala = k === 0 ? 0.85 : 0.6 + azar() * 0.6
  const dx = k === 0 ? 0 : (azar() - 0.5) * 70
  const dy = k === 0 ? 0 : (azar() - 0.5) * 70
  const espejo = k > 0 && azar() < 0.3
  const grueso = k > 0 && azar() < 0.4
  ctx.translate(LADO / 2 + dx, LADO / 2 + dy)
  ctx.rotate((giro * Math.PI) / 180)
  ctx.scale(espejo ? -escala : escala, escala)
  const alto = LADO
  const ancho = (img.width / img.height) * alto
  // Trazo grueso: el dibujo varias veces, un poco movido (con trazos finos MediaPipe casi no encuentra la mano).
  const g = grueso ? 3 : 2
  for (const [ox, oy] of [[0, 0], [g, 0], [-g, 0], [0, g], [0, -g]]) ctx.drawImage(img, -ancho / 2 + ox, -alto / 2 + oy, ancho, alto)
  ctx.setTransform(1, 0, 0, 1, 0, 0)
  colorear(ctx, azar, k)
  // Un poco de desenfoque, como una foto.
  const foto = document.createElement('canvas')
  foto.width = foto.height = LADO
  const fctx = foto.getContext('2d')
  fctx.filter = 'blur(1.2px)'
  fctx.drawImage(c, 0, 0)
  return { canvas: foto, giro, escala, dx, dy, espejo, grueso }
}

/**
 * MediaPipe aprendió con fotos de manos de verdad: con líneas sobre blanco no encuentra nada.
 * «Coloreamos» el dibujo como en un libro de colorear: el fondo es lo que se alcanza desde el borde
 * sin cruzar una línea; lo que queda encerrado por las líneas es la mano y se pinta color piel.
 */
const PIELES = [[224, 172, 138], [241, 194, 160], [198, 140, 105], [233, 185, 150]]
function colorear(ctx, azar, k) {
  const datos = ctx.getImageData(0, 0, LADO, LADO)
  const px = datos.data
  const claro = (i) => px[i * 4] + px[i * 4 + 1] + px[i * 4 + 2] > 600
  // 1) La mano es el trazo oscuro más grande (la letra de abajo es otro trazo, más chico).
  const etiqueta = new Int32Array(LADO * LADO).fill(-1)
  let mayor = { id: -1, n: 0, pixeles: [] }
  for (let i0 = 0, id = 0; i0 < LADO * LADO; i0++) {
    if (claro(i0) || etiqueta[i0] >= 0) continue
    const pixeles = []
    const cola = [i0]
    etiqueta[i0] = id
    while (cola.length) {
      const i = cola.pop()
      pixeles.push(i)
      const x = i % LADO
      for (const j of [x > 0 ? i - 1 : -1, x < LADO - 1 ? i + 1 : -1, i - LADO, i + LADO]) {
        if (j >= 0 && j < LADO * LADO && etiqueta[j] < 0 && !claro(j)) {
          etiqueta[j] = id
          cola.push(j)
        }
      }
    }
    if (pixeles.length > mayor.n) mayor = { id, n: pixeles.length, pixeles }
    id++
  }
  // 2) Cerrar la muñeca: unir el punto más bajo del lado izquierdo con el del lado derecho de la mano.
  const barrera = new Uint8Array(LADO * LADO)
  if (mayor.n) {
    const cx = mayor.pixeles.reduce((s, i) => s + (i % LADO), 0) / mayor.n
    let izq = null
    let der = null
    for (const i of mayor.pixeles) {
      const x = i % LADO
      const y = Math.floor(i / LADO)
      if (x < cx && (!izq || y > izq.y)) izq = { x, y }
      if (x >= cx && (!der || y > der.y)) der = { x, y }
    }
    if (izq && der) {
      const pasos = Math.max(Math.abs(der.x - izq.x), Math.abs(der.y - izq.y)) + 1
      for (let t = 0; t <= pasos; t++) {
        const x = Math.round(izq.x + ((der.x - izq.x) * t) / pasos)
        const y = Math.round(izq.y + ((der.y - izq.y) * t) / pasos)
        for (let oy = -2; oy <= 2; oy++) for (let ox = -2; ox <= 2; ox++) {
          const xx = x + ox
          const yy = y + oy
          if (xx >= 0 && xx < LADO && yy >= 0 && yy < LADO) barrera[yy * LADO + xx] = 1
        }
      }
    }
  }
  const fondo = new Uint8Array(LADO * LADO)
  const pila = []
  for (let x = 0; x < LADO; x++) pila.push(x, (LADO - 1) * LADO + x)
  for (let y = 0; y < LADO; y++) pila.push(y * LADO, y * LADO + LADO - 1)
  while (pila.length) {
    const i = pila.pop()
    if (fondo[i] || !claro(i) || barrera[i]) continue
    fondo[i] = 1
    const x = i % LADO
    if (x > 0) pila.push(i - 1)
    if (x < LADO - 1) pila.push(i + 1)
    if (i >= LADO) pila.push(i - LADO)
    if (i < LADO * (LADO - 1)) pila.push(i + LADO)
  }
  const piel = PIELES[k === 0 ? 0 : Math.floor(azar() * PIELES.length)]
  const fondoColor = k === 0 ? [255, 255, 255] : [235 + azar() * 20, 235 + azar() * 20, 235 + azar() * 20]
  for (let i = 0; i < LADO * LADO; i++) {
    const o = i * 4
    let color
    if (fondo[i]) color = fondoColor
    else if (claro(i)) {
      // Piel con sombra: más clara arriba y en el centro, más oscura en las orillas, con un poco de ruido.
      const y = Math.floor(i / LADO) / LADO
      const x = (i % LADO) / LADO
      const luz = 1.08 - 0.22 * y - 0.25 * Math.abs(x - 0.5) + (Math.random() - 0.5) * 0.06
      color = piel.map((v) => Math.min(255, v * luz))
    }
    else color = [piel[0] * 0.55, piel[1] * 0.5, piel[2] * 0.5] // las líneas, como pliegues de la piel
    px[o] = color[0]
    px[o + 1] = color[1]
    px[o + 2] = color[2]
  }
  ctx.putImageData(datos, 0, 0)
}

// Para revisar a ojo: la variación con los puntos que encontró MediaPipe encima.
window.conPuntos = async (letra, k) => {
  const vision = await FilesetResolver.forVisionTasks('/mediapipe/wasm')
  window._det ??= await HandLandmarker.createFromOptions(vision, { baseOptions: { modelAssetPath: '/mediapipe/hand_landmarker.task', delegate: 'CPU' }, runningMode: 'IMAGE', numHands: 1, minHandDetectionConfidence: 0.1, minHandPresenceConfidence: 0.1 })
  const azar = generador(7)
  // Repetir el azar como en extraer() hasta llegar a la variación k de esa letra.
  let v
  for (const l of LETRAS) {
    const img = await cargarImagen(l)
    for (let j = 0; j < 120; j++) {
      v = variacion(img, azar, j)
      if (l === letra && j === k) break
    }
    if (l === letra) break
  }
  const r = window._det.detect(v.canvas)
  const ctx = v.canvas.getContext('2d')
  ctx.fillStyle = '#e11d48'
  for (const p of r.landmarks[0] ?? []) ctx.fillRect(p.x * LADO - 4, p.y * LADO - 4, 8, 8)
  ctx.strokeStyle = '#2563eb'
  ctx.lineWidth = 2
  const pts = r.landmarks[0] ?? []
  for (const [a, b] of [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]]) {
    if (!pts[a]) continue
    ctx.beginPath(); ctx.moveTo(pts[a].x * LADO, pts[a].y * LADO); ctx.lineTo(pts[b].x * LADO, pts[b].y * LADO); ctx.stroke()
  }
  return v.canvas.toDataURL('image/png')
}

// Para revisar a ojo: una variación coloreada como imagen.
window.muestra = async (letra, k = 0) => {
  const v = variacion(await cargarImagen(letra), generador(7 + k), k)
  return v.canvas.toDataURL('image/png')
}

window.extraer = async (porLetra = 40, semilla = 7) => {
  const vision = await FilesetResolver.forVisionTasks('/mediapipe/wasm')
  const detector = await HandLandmarker.createFromOptions(vision, {
    baseOptions: { modelAssetPath: '/mediapipe/hand_landmarker.task', delegate: 'CPU' },
    runningMode: 'IMAGE',
    numHands: 1,
    minHandDetectionConfidence: 0.1,
    minHandPresenceConfidence: 0.1,
  })
  const azar = generador(semilla)
  const filas = []
  for (const letra of LETRAS) {
    const img = await cargarImagen(letra)
    for (let k = 0; k < porLetra; k++) {
      const v = variacion(img, azar, k)
      const r = detector.detect(v.canvas)
      filas.push({
        letra,
        variacion: k,
        giro: +v.giro.toFixed(1), escala: +v.escala.toFixed(2), espejo: v.espejo, grueso: v.grueso,
        detectada: r.landmarks.length > 0,
        lado: r.handedness[0]?.[0]?.categoryName ?? null,
        confianza: r.handedness[0]?.[0]?.score ?? null,
        puntos: r.landmarks[0]?.map((p) => [+p.x.toFixed(4), +p.y.toFixed(4), +p.z.toFixed(4)]) ?? null,
      })
    }
  }
  return JSON.stringify(filas)
}
document.title = 'listo'
</script>
</body>
</html>
